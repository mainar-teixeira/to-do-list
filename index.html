<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <header>
        <h1>To-Do-pro</h1>
        <div class="bts-filter">
            <button id="filter1">Todas</button>
            <button id="filter2">Concluídas</button>
            <button id="filter3">Pendentes</button>
        </div>
    </header>
    <main>
        <section class="guard">
            
        </section>
        <section class="make">
            <textarea name="" id="textoTarefa" style="resize: none;" maxlength="112"></textarea>
            <button id="Add">Adicionar</button>
            <div class="h-borderColors">
                <div class="bGreen">
                    <div class="t-color" style="background-color: green;"></div>
                    <p class="txtColor">Você concluiu</p>
                </div>
                <div class="bBlue">
                    <div class="t-color" style="background-color: aqua;"></div>
                    <p class="txtColor">Você está editando</p>
                </div>
                <div class="bRed">
                    <div class="t-color" style="background-color: red;"></div>
                    <p class="txtColor">Está pendente</p>
                </div>
            </div>
        </section>
    </main>
    <p id="result"></p>
    <script src="script.js"></script>
</body>
</html>
